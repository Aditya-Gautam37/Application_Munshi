<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Munshi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='jl-app.css') }}" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #3949ab 0%, #5c6bc0 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.2); padding: 2rem; width: 100%; max-width: 420px; }
    .login-brand { display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin-bottom: 1.5rem; }
    .login-brand-logo { width: 44px; height: 44px; background: linear-gradient(135deg, #3949ab, #f57c00); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 1.1rem; }
    .login-brand-name { font-weight: 700; font-size: 1.2rem; }
    .login-hint { font-size: 0.85rem; color: #666; }
    .pre-lang { display: flex; justify-content: center; gap: 4px; margin-bottom: 1rem; }
    .pre-lang a { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; text-decoration: none; color: #5c6bc0; border: 1px solid #d5d9ee; }
    .pre-lang a.is-active { background: #3949ab; color: #fff; border-color: #3949ab; }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-card mx-auto">
      <div class="pre-lang">
        <a href="{{ url_for('set_lang', code='en') }}" class="{{ 'is-active' if lang != 'hi' else '' }}">English</a>
        <a href="{{ url_for('set_lang', code='hi') }}" class="{{ 'is-active' if lang == 'hi' else '' }}">हिंदी</a>
      </div>
      <div class="login-brand">
        <div class="login-brand-logo">M</div>
        <div class="login-brand-name">Munshi</div>
      </div>

      {% with msgs = get_flashed_messages() %}
        {% if msgs %}
          {% for m in msgs %}<div class="alert alert-warning small">{{ m }}</div>{% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">{{ t('Username') }}</label>
          <input type="text" name="username" class="form-control" autofocus required
                 autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">{{ t('Password') }}</label>
          <input type="password" name="password" class="form-control" required
                 autocomplete="current-password">
        </div>
        <button class="btn btn-primary w-100" type="submit">
          <i class="bi bi-box-arrow-in-right me-1"></i>{{ t('Sign in') }}
        </button>
      </form>

      <div class="login-hint mt-3 text-center">
        {{ t("Don't have a login? Ask your admin to create one for you.") }}
      </div>
    </div>
  </div>
</body>
</html>
