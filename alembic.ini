[alembic]
script_location = munshi/pg/migrations

# sqlalchemy.url is intentionally NOT set here — env.py reads DATABASE_URL
# from the environment (same convention as GOOGLE_API_KEY etc. in .env),
# so the same repo checkout is safe to point at a local test DB or the real
# Supabase project without ever writing a credential into a tracked file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
